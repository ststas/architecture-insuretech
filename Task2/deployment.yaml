apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp
  labels:
    app: scaletestapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
    spec:
      containers:
        - name: scaletestapp
          image: ghcr.io/yandex-practicum/scaletestapp:latest
          # образ только amd64: в Minikube на arm64 он загружен в узел вручную, повторно не тянем
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            # HPA считает утилизацию памяти от requests, поэтому requests обязателен
            requests:
              memory: "30Mi"
            limits:
              memory: "30Mi"
