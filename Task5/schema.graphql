# GraphQL-схема сервиса client-info.
# Эквивалент REST API (Swagger 2.0, версия 1.0.0): три метода GET по id клиента.
# Документы и родственники вынесены во вложенные поля клиента, поэтому все
# три REST-ресурса покрываются одним запросом client(id).

"Дата в формате ISO 8601 (YYYY-MM-DD). В REST-контракте поле было строкой без формата."
scalar Date

type Query {
  """
  Клиент по идентификатору.
  Заменяет GET /clients/{id}, GET /clients/{id}/documents и GET /clients/{id}/relatives:
  набор данных определяется полями, которые указал потребитель.
  Возвращает null, если клиент не найден.
  """
  client(id: ID!): Client
}

"Карточка клиента."
type Client {
  "Идентификатор клиента."
  id: ID!
  "Имя клиента."
  name: String
  "Возраст клиента."
  age: Int
  "Документы клиента (GET /clients/{id}/documents). Пустой список, если документов нет."
  documents: [Document!]!
  "Родственники клиента (GET /clients/{id}/relatives). Пустой список, если родственников нет."
  relatives: [Relative!]!
}

"Документ клиента."
type Document {
  "Идентификатор документа."
  id: ID!
  "Тип документа (в REST-контракте строка без перечня значений)."
  type: String
  "Номер документа."
  number: String
  "Дата выдачи."
  issueDate: Date
  "Дата окончания срока действия."
  expiryDate: Date
}

"Родственник клиента."
type Relative {
  "Идентификатор родственника."
  id: ID!
  "Степень родства (в REST-контракте строка без перечня значений)."
  relationType: String
  "Имя родственника."
  name: String
  "Возраст родственника."
  age: Int
}
